{% load static %}
      {% load static_v %}
      <header class="header">
        <a href="{% url 'landing:home' %}">
          <h1 class="logo">
            <img src="{% static_v 'images/logo.svg' %}" alt="{{ site_settings.name }}">
            <span class="logo-text">{{ site_settings.name }}</span>
          </h1>
        </a>

        <nav class="navbar">
          <a href="{% url 'landing:home' %}#home"{% if is_landing %} class="active"{% endif %}>الرئيسية</a>
          <a href="{% url 'courses:list' %}">الدورات</a>
          <a href="{% url 'projects:list' %}">المشاريع</a>
          <a href="{% url 'accounts:list' %}">المستقلين</a>
        </nav>

        <div class="icons">
          {% if user.is_authenticated %}
            <button type="button" id="account-btn" class="i-account" title="خيارات الحساب" aria-label="خيارات الحساب" aria-haspopup="dialog" aria-expanded="false" data-account-initial="{% if server_profile.name %}{{ server_profile.name|slice:':1' }}{% else %}{{ user.display_name|slice:':1' }}{% endif %}">
              {% if server_profile.avatar %}
              <img class="account-av" src="{{ server_profile.avatar }}" alt="" width="34" height="34">
              {% else %}
              <span class="account-initial" aria-hidden="true">{% if server_profile.name %}{{ server_profile.name|slice:':1' }}{% else %}{{ user.display_name|slice:':1' }}{% endif %}</span>
              {% endif %}
            </button>
          {% else %}
            <button type="button" id="account-btn" class="i-account" title="خيارات الحساب" aria-label="خيارات الحساب" aria-haspopup="dialog" aria-expanded="false">
              <svg class="ic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </button>
          {% endif %}
          <button type="button" id="headerThemeBtn" title="تبديل المظهر" aria-label="تبديل المظهر"></button>
        </div>
      </header>
