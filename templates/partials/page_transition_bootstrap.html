<script>
  (function () {
    var root = document.documentElement;
    var body = document.body;
    var transitionClass = 'is-page-transitioning';
    var pendingAttribute = 'data-page-transition-pending';
    var layouts = {
      landing: 'home',
      'all-courses': 'listing',
      'all-projects': 'listing',
      'all-users': 'listing',
      course: 'detail',
      project: 'detail',
      playlist: 'detail',
      'user-profile': 'profile',
      home: 'profile',
      'profile-edit': 'editor',
      'edit-project': 'editor',
      certificate: 'certificate',
      admin: 'admin'
    };

    try {
      if (body && body.getAttribute('data-page') === 'edit-course') {
        sessionStorage.removeItem('dc-page-transition');
        root.removeAttribute(pendingAttribute);
        if (!root.hasAttribute('data-initial-page-loading')) {
          root.classList.remove(transitionClass);
          root.classList.remove('is-page-transition-settling');
        }
        return;
      }

      var destination = sessionStorage.getItem('dc-page-transition');
      if (destination && new URL(destination, location.href).origin === location.origin && body) {
        var layout = body.classList.contains('auth-body')
          ? 'auth'
          : layouts[body.getAttribute('data-page')];

        if (layout) {
          body.setAttribute('data-transition-layout', layout);
          root.setAttribute(pendingAttribute, '');
          window.__pageLoadingStartedAt = performance.now();
          root.classList.add(transitionClass);
        }
      }
      sessionStorage.removeItem('dc-page-transition');
    } catch (error) {
      console.warn('Page transition state could not be restored.', error);
    }
  })();
</script>
