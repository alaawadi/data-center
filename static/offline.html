<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>أنت غير متصل — مركز داتا</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #172033; background: linear-gradient(145deg, #eff6ff, #f8fafc 55%, #fff7ed); font-family: system-ui, "Segoe UI", sans-serif; }
    main { width: min(100%, 440px); padding: 34px 28px; text-align: center; background: #fff; border: 1px solid #dbe6f3; border-radius: 24px; box-shadow: 0 18px 55px #17203318; }
    .icon { width: 68px; height: 68px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 22px; color: #2563eb; background: #eaf2ff; font-size: 32px; }
    h1 { margin: 0 0 10px; font-size: 23px; }
    p { margin: 0; color: #64748b; line-height: 1.8; }
    button { margin-top: 22px; padding: 11px 22px; border: 0; border-radius: 12px; color: #fff; background: #2563eb; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">📡</div>
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>الصفحات العامة التي زرتها وبعض ملفات الموقع متاحة دون اتصال. أعد الاتصال بالإنترنت ثم حاول فتح الصفحة مجدداً.</p>
    <button type="button" onclick="location.reload()">إعادة المحاولة</button>
  </main>
</body>
</html>
