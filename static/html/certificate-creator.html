<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شهادة تدريب - مركز داتا</title>
<link rel="stylesheet" href="../css/fonts-local.css">
<style>
:root{--page:#e9ebf0;--ink:#1d2433;--panel:#fff;--line:#cfd4de;--blue:#2f4b8f;--navy:#1f2f5c;--gray:#4a5160;--red:#c8383f;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#14171f;--ink:#e8eaf0;--panel:#1d212c;--line:#363c4b}}
:root[data-theme="dark"]{--page:#14171f;--ink:#e8eaf0;--panel:#1d212c;--line:#363c4b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:'Cairo',Tahoma,sans-serif;padding:16px}
.controls{max-width:1123px;margin:0 auto 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:1fr;gap:10px;align-items:end}
.controls label{display:grid;gap:4px;font-size:13px;font-weight:700}
.controls input,.controls select{font:inherit;font-weight:400;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:inherit;width:100%}
.controls input[dir="ltr"]{text-align:left}
.controls input:focus-visible,.controls select:focus-visible,.controls button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.controls button{font:inherit;font-weight:700;padding:10px 14px;border:0;border-radius:8px;background:var(--navy);color:#fff;cursor:pointer}
.controls button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.controls button:disabled{opacity:.6;cursor:wait}
.dur{display:block}
.preview-language{max-width:1123px;margin:0 auto 12px;display:flex;justify-content:center}
.language-switch{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.language-switch button{min-width:88px;padding:7px 16px;border:0;border-radius:999px;background:transparent;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.language-switch button[aria-pressed="true"]{background:var(--navy);color:#fff}
.status{grid-column:1/-1;margin:0;font-size:14px;min-height:20px;color:var(--gray)}
.sheet{display:block;width:100%;max-width:1123px;height:auto;margin:0 auto;background:#fff;box-shadow:0 8px 30px rgba(20,30,60,.25)}
@media (min-width:768px){.controls{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media print{
  @page{size:A4 landscape;margin:0}
  body{padding:0;background:#fff}
  .controls,.preview-language{display:none}
  .sheet{width:297mm;max-width:none;height:210mm;box-shadow:none;margin:0}
}
</style>
</head>
<body>
<section class="controls" aria-label="بيانات الشهادة">
  <label>اسم الطالب/ة بالعربية <input id="fName" placeholder="اكتب اسم الطالب/ة" autocomplete="off"></label>
  <label>الاسم بالإنجليزية <input id="fNameEn" dir="ltr" placeholder="Student name" autocomplete="off"></label>
  <label>اسم الدورة بالعربية <input id="fCourse" value="برمجة المواقع والتطبيقات بالـ AI"></label>
  <label>اسم الدورة بالإنجليزية <input id="fCourseEn" dir="ltr" value="Website and App Programming with AI"></label>
  <label>عدد ساعات الدورة أو الورشة <input id="fHours" type="number" min="1" step="1" value="12" inputmode="numeric"></label>
  <label>اسم المدرب بالعربية <input id="fTrainer" placeholder="اكتب اسم المدرب" autocomplete="off"></label>
  <label>اسم المدرب بالإنجليزية <input id="fTrainerEn" dir="ltr" placeholder="Trainer name" autocomplete="off"></label>
  <label>تاريخ الإصدار (اختياري) <input id="fDate" type="date"></label>
  <label>نوع الشهادة <select id="fType"><option>دورة</option><option>ورشة</option></select></label>
  <label>الصفة <select id="fGender"><option value="x">طالب/ة</option><option value="m">طالب</option><option value="f">طالبة</option></select></label>
  <button id="pdf" type="button">تحميل PDF (النسخة المعروضة)</button>
  <button id="pdfBoth" type="button">تحميل النسختين (عربي + English)</button>
  <button id="print" type="button" class="alt">طباعة</button>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</section>

<div class="preview-language">
  <div class="language-switch" role="group" aria-label="لغة معاينة الشهادة">
    <button id="langAr" type="button" data-lang="ar" aria-pressed="true">العربية</button>
    <button id="langEn" type="button" data-lang="en" aria-pressed="false">English</button>
  </div>
</div>
<canvas id="sheet" class="sheet" width="3369" height="2382" role="img" aria-label="معاينة الشهادة"></canvas>

      var d=durEn(hrs),kind=ws?'workshop':'course';
      return {
        title:'Certificate of Training',
        lead:'Data Center for Training and Development',
        lblStudent:'hereby certifies that:',
        name:$('fNameEn').value.trim(), namePh:'Student name',
        lblCourse:'has successfully completed the training '+kind+' entitled:',
        course:$('fCourseEn').value.trim()||'—',
        dur:d?'Duration: '+d:'',
        wish:'We wish '+(g==='m'?'him':g==='f'?'her':'them')+' continued success and prosperity.',
        trainer:$('fTrainerEn').value.trim(),
        trainerLbl:(ws?'Workshop':'Course')+' Trainer', director:'Center Director',
        date:dt?'Issued on: '+new Date(dt+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):'',
        label:'Certificate of Training'
      };
    }
    var the=ws?'الورشة':'الدورة',d2=durAr(hrs);
    return {
      title:'شهادة تدريب',
      lead:'يشهد مركز داتا للتدريب والتطوير',
      lblStudent:'بأن '+(g==='m'?'الطالب':g==='f'?'الطالبة':'الطالب/ة')+':',
      name:$('fName').value.trim(), namePh:'اسم الطالب/ة',
      lblCourse:'قد '+(g==='m'?'أتمّ':g==='f'?'أتمّت':'أتمّ/ت')+' بنجاح '+t+' تدريبية بعنوان:',
      course:$('fCourse').value.trim()||'—',
      dur:d2?'مدة '+the+' '+d2:'',
      wish:'تمنياتنا '+(g==='m'?'له':g==='f'?'لها':'له/لها')+' بالتوفيق والنجاح الدائم',
      trainer:$('fTrainer').value.trim(),
      trainerLbl:'مدرب '+the, director:'مدير المركز',
      date:dt?'تاريخ الإصدار: '+new Date(dt+'T00:00').toLocaleDateString('ar-PS-u-nu-latn',{year:'numeric',month:'long',day:'numeric'}):'',
      label:'شهادة تدريب'
    };
  }

  function wave(x,mirror,flip,hi){
    x.save();
    if(mirror){x.translate(W,0);x.scale(-1,1)}
    if(flip){x.translate(0,H);x.scale(1,-1)}
    var g1=x.createLinearGradient(0,0,520,0);g1.addColorStop(0,'rgb(47,75,143)');g1.addColorStop(1,'rgba(154,167,204,.15)');
    x.globalAlpha=.85;x.fillStyle=g1;x.fill(new Path2D(P1));
    var g2=x.createLinearGradient(0,0,430,0);g2.addColorStop(0,'rgb(200,56,63)');g2.addColorStop(1,'rgba(233,138,143,.2)');
    x.globalAlpha=1;x.fillStyle=g2;x.fill(new Path2D(P2));
    if(hi){x.globalAlpha=.35;x.fillStyle='#fff';x.fill(new Path2D(P3))}
    x.restore();
  }
  function fitFont(x,txt,tpl,size,maxW,min){
    var s=size;
    for(;s>min;s-=2){x.font=tpl.replace('{s}',s);if(x.measureText(txt).width<=maxW)break}
    x.font=tpl.replace('{s}',s);return s;
  }

  function draw(exporting,L){
    var m=model(L),ar=L==='ar',f=FONTS[L].default;
    var D='700 {s}px '+f.d+FB, B='700 {s}px '+f.t+FB, R='400 {s}px '+f.t+FB;
    var x=cv.getContext('2d');
    x.setTransform(S,0,0,S,0,0);
    x.fillStyle='#fff';x.fillRect(0,0,W,H);
    x.direction=ar?'rtl':'ltr';x.textAlign='center';x.textBaseline='middle';
    var cx=W/2;

    wave(x,true,false,true);
    wave(x,false,true,false);
    x.strokeStyle='#2f4b8f';x.lineWidth=2;x.strokeRect(27,27,W-54,H-54);
    x.strokeStyle='#9aa7cc';x.lineWidth=1;x.strokeRect(35.5,35.5,W-71,H-71);
    if(imgs.logo) x.drawImage(imgs.logo,cx-56,36,112,112);

    x.fillStyle='#1f2f5c';x.font=D.replace('{s}',ar?64:58);x.fillText(m.title,cx,196);

    var og=x.createLinearGradient(cx-170,0,cx+170,0);
    og.addColorStop(0,'rgba(200,56,63,0)');og.addColorStop(.5,'rgb(200,56,63)');og.addColorStop(1,'rgba(200,56,63,0)');
    x.fillStyle=og;x.fillRect(cx-170,240,142,1.2);x.fillRect(cx+28,240,142,1.2);
    x.fillStyle='#c8383f';x.save();x.translate(cx,240.6);x.rotate(Math.PI/4);x.fillRect(-4.5,-4.5,9,9);x.restore();

    x.fillStyle='#1f2f5c';x.font=B.replace('{s}',27);x.fillText(m.lead,cx,282);
    x.fillStyle='#4a5160';x.font=R.replace('{s}',21);x.fillText(m.lblStudent,cx,322);

    var ny=384;
    if(m.name){fitFont(x,m.name,D,64,760,34);x.fillStyle='#c8383f';x.fillText(m.name,cx,ny)}
    else if(!exporting){x.font=D.replace('{s}',50);x.fillStyle='#e6cfd1';x.fillText(m.namePh,cx,ny)}
    x.font=D.replace('{s}',50);
    var nw=m.name?x.measureText(m.name).width:0;
    var lw=Math.max(440,Math.min(820,nw+60));
    x.fillStyle='#e3b4b7';x.fillRect(cx-lw/2,ny+38,lw,2);

    x.fillStyle='#4a5160';x.font=R.replace('{s}',21);x.fillText(m.lblCourse,cx,ny+80);
    fitFont(x,m.course,B,40,860,22);x.fillStyle='#2f4b8f';x.fillText(m.course,cx,ny+126);

    if(m.dur){
      x.font=R.replace('{s}',22);var tw=x.measureText(m.dur).width,total=tw+36,iy=ny+178,ix,tx;
      if(ar){var sx=cx+total/2;ix=sx-13;tx=sx-36-tw/2}
      else{var ex=cx-total/2;ix=ex+13;tx=ex+36+tw/2}
      x.fillStyle='#4a5160';x.fillText(m.dur,tx,iy);
      x.save();x.translate(ix,iy);x.strokeStyle='#c8383f';x.lineWidth=1.8;x.lineCap='round';
      x.beginPath();x.arc(0,0,11,0,Math.PI*2);x.stroke();
      x.beginPath();x.moveTo(0,-6);x.lineTo(0,0);x.lineTo(4.5,3.5);x.stroke();x.restore();
    }
    x.fillStyle='#4a5160';x.font=R.replace('{s}',20);x.fillText(m.wish,cx,ny+222);

    x.save();x.translate(cx-34,636);x.scale(.8,.8);
    x.fillStyle='#2f4b8f';x.fill(new Path2D('M26 58 14 96l16-9 8 13 8-36Z'));
    x.fillStyle='#c8383f';x.fill(new Path2D('M58 58 70 96l-16-9-8 13-8-36Z'));
    x.beginPath();x.arc(42,38,32,0,Math.PI*2);x.fillStyle='#2f4b8f';x.fill();
    x.beginPath();x.arc(42,38,26,0,Math.PI*2);x.strokeStyle='#fff';x.lineWidth=1.5;x.setLineDash([2,3]);x.stroke();x.setLineDash([]);
    x.fillStyle='#fff';x.fill(new Path2D('m42 22 4.6 9.6 10.4 1.4-7.6 7.3 1.9 10.4L42 45.6l-9.3 5.1 1.9-10.4-7.6-7.3 10.4-1.4Z'));
    x.restore();

    if(m.date){x.fillStyle='#4a5160';x.font=R.replace('{s}',14);x.fillText(m.date,cx,746)}

    var rx=W-120-115,lx=120+115,ly=692;
    var tX=ar?rx:lx, dX=ar?lx:rx;
    x.strokeStyle='#4a5160';x.lineWidth=1;x.setLineDash([2,3]);
    [rx,lx].forEach(function(c){x.beginPath();x.moveTo(c-115,ly);x.lineTo(c+115,ly);x.stroke()});
    x.setLineDash([]);
    x.fillStyle='#4a5160';x.font=R.replace('{s}',17);
    x.fillText(m.trainerLbl,tX,ly+22);x.fillText(m.director,dX,ly+22);
    if(m.trainer){fitFont(x,m.trainer,B,22,230,14);x.fillStyle='#1f2f5c';x.fillText(m.trainer,tX,ly-22)}
    if(imgs.stamp){x.save();x.translate(dX,ly-34);x.rotate(-9*Math.PI/180);x.drawImage(imgs.stamp,-68,-68,136,136);x.restore()}

    cv.setAttribute('aria-label',m.label+(m.name?' - '+m.name:''));
  }

  async function loadFonts(L){
    var m=model(L),f=FONTS[L].default;
    try{
      await Promise.all([
        document.fonts.load('700 40px '+f.d,m.title+' '+m.name+' '+m.namePh),
        document.fonts.load('700 20px '+f.t,m.lead+' '+m.course+' '+m.trainer+' '+m.trainerLbl+' AI 0123456789'),
        document.fonts.load('400 20px '+f.t,m.lblStudent+m.lblCourse+m.wish+m.dur+m.date+m.director)
      ]);
    }catch(e){}
  }
  var token=0;
  async function paint(){
    var my=++token,L=lang();
    await loadFonts(L);
    if(my!==token)return;
    draw(false,L);
  }
  ['fName','fGender','fTrainer','fType','fCourse','fHours','fDate','fNameEn','fTrainerEn','fCourseEn'].forEach(function(i){
    $(i).addEventListener('input',paint);$(i).addEventListener('change',paint);
  });
  document.querySelectorAll('.language-switch [data-lang]').forEach(function(button){
    button.addEventListener('click',function(){
      activeLang=button.getAttribute('data-lang');
      document.querySelectorAll('.language-switch [data-lang]').forEach(function(option){
        option.setAttribute('aria-pressed',String(option===button));
      });
      paint();
    });
  });

  function say(t,bad){var s=$('status');s.textContent=t;s.style.color=bad?'#c8383f':''}
  var dl=null;
  if(window.claude&&claude.use){claude.use('downloads').then(function(v){dl=v}).catch(function(){})}

  window.addEventListener('beforeprint',function(){draw(true,lang())});
  window.addEventListener('afterprint',function(){draw(false,lang())});
  $('print').addEventListener('click',function(){window.print()});

  function check(L){
    if(L==='ar'){
      if(!$('fName').value.trim()) return {msg:'اكتب اسم الطالب/ة بالعربية أولًا.',el:'fName'};
      if(!$('fCourse').value.trim()) return {msg:'اكتب عنوان الدورة أو الورشة بالعربية أولًا.',el:'fCourse'};
    }else{
      if(!$('fNameEn').value.trim()) return {msg:'اكتب اسم الطالب/ة بالإنجليزية أولًا.',el:'fNameEn'};
      if(!$('fCourseEn').value.trim()) return {msg:'اكتب عنوان الدورة أو الورشة بالإنجليزية أولًا.',el:'fCourseEn'};
    }
    return null;
  }

  async function exportPdf(langs){
    for(var i=0;i<langs.length;i++){var c=check(langs[i]);if(c){say(c.msg,true);$(c.el).focus();return}}
    if(!window.jspdf){say('تعذّر تحميل أداة PDF. استخدم زر الطباعة واختر "حفظ كـ PDF".',true);return}
    var b1=$('pdf'),b2=$('pdfBoth');b1.disabled=b2.disabled=true;say('جارٍ تجهيز ملف PDF...');
    try{
      var pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4',compress:true});
      pdf.setProperties({title:'Certificate / شهادة تدريب',creator:'Data Center'});
      for(var i=0;i<langs.length;i++){
        await loadFonts(langs[i]);draw(true,langs[i]);
        if(i>0)pdf.addPage('a4','landscape');
        pdf.addImage(cv.toDataURL('image/jpeg',0.97),'JPEG',0,0,297,210);
      }
      draw(false,lang());
      var blob=pdf.output('blob');
      if(!dl){say('الحفظ المباشر غير متاح هنا. اختر "حفظ كـ PDF" من نافذة الطباعة.',true);window.print();return}
      var fn=((langs.length===1&&langs[0]==='en'?$('fNameEn').value:$('fName').value).replace(/[\\\/:*?"<>|]/g,'').replace(/\s+/g,' ').trim()||'certificate')+'.pdf';
            
            
      await dl.save({filename:fn,data:blob});
      say('تم حفظ الشهادة.');
    }catch(e){
      draw(false,lang());
      if(e&&e.code==='declined') say('تم إلغاء الحفظ.');
      else say('حدث خطأ أثناء إنشاء الملف. جرّب زر الطباعة.',true);
    }finally{b1.disabled=b2.disabled=false}
  }
  $('pdf').addEventListener('click',function(){exportPdf([lang()])});
  $('pdfBoth').addEventListener('click',function(){exportPdf(['ar','en'])});

  Promise.all([loadImg(LOGO),loadImg(STAMP)]).then(function(a){imgs.logo=a[0];imgs.stamp=a[1];paint()});
  paint();
})();
</script>
